version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: supervity-workbench-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supervity_secure_password_2026
      POSTGRES_DB: supervity_workbench
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
